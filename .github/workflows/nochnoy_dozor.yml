name: Nochnoy Dozor (storozh taygi)

# Safety net: if the proxy run dies early and the generational handover
# dispatch failed, cron would leave the proxy dead. Checks every 30 min
# and starts a fresh run when none is active. A generation retires its
# predecessor itself once verified, so newest always wins.
# Improved with retry logic and enhanced logging.

on:
  schedule:
    - cron: '23,53 * * * *'  # check every 30 minutes (xx:23 and xx:53)
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  watch:
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restart proxy if no run is active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Nochnoy Dozor Watch Start ==="
          echo "Checking for active sibirskiy_medved runs (in_progress/queued/waiting)..."
          N1=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sibirskiy_medved.yml \
            --status in_progress --limit 1 --json databaseId -q 'length')
          N2=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sibirskiy_medved.yml \
            --status queued --limit 1 --json databaseId -q 'length')
          N3=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sibirskiy_medved.yml \
            --status waiting --limit 1 --json databaseId -q 'length')
          N=$(( ${N1:-0} + ${N2:-0} + ${N3:-0} ))
          if [ "${N:-0}" -ge 1 ]; then
            echo "✓ Proxy run ACTIVE (${N} run(s) in progress) - nothing to do."
            exit 0
          fi
          echo "✗ No active proxy run found - attempting to dispatch fresh run..."
          # Retry logic: try up to 3 times with 1-minute backoff
          for attempt in 1 2 3; do
            echo "Dispatch attempt ${attempt}/3..."
            if gh workflow run sibirskiy_medved.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "✓ Dispatch SUCCESS - new run started"
              exit 0
            else
              echo "✗ Dispatch attempt ${attempt} failed"
              if [ $attempt -lt 3 ]; then
                echo "Waiting 60 seconds before retry..."
                sleep 60
              fi
            fi
          done
          echo "✗ All dispatch attempts failed - will retry next scheduled tick (30 min)"
          echo "Possible causes: workflow disabled, repo not public, or GitHub API rate limit"
          exit 1
