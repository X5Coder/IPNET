name: Sibirskiy Medved (dozor taygi)

on:
  workflow_dispatch:
  schedule:
    # Every 6h a new generation starts: it verifies + publishes its own
    # tunnel first, then retires the older run (overlapping handover,
    # no gap). Each generation gets a fresh random trycloudflare URL;
    # clients follow it automatically within a minute.
    - cron: '17 */6 * * *'
  push:
    # ZIP-manual setup: starts right after upload. Bot commits (*.txt,
    # *.md) never match these code paths, so no self-trigger loop.
    paths:
      - "severnyy_medved.py"
      - "matryoshka_dvigatel.json"
      - ".github/workflows/sibirskiy_medved.yml"

permissions:
  contents: write
  actions: write  # retire step cancels the older run after handover

# Generational handover (NOT cancel-on-start): the new run verifies +
# publishes its own tunnel first, then retires the older run. Killing
# the old run at startup would open a setup gap every cycle.
concurrency:
  group: sibirskiy-medved
  cancel-in-progress: false

jobs:
  proxy:
    # Never run on the template repo itself (schedule would burn minutes
    # and push endpoint files to main). User copies run elsewhere.
    if: github.repository != 'X5Coder/VOLK'
    runs-on: ubuntu-latest
    timeout-minutes: 280  # ~4.5h cap (under abuse radar)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start local HTTP proxy (self-test + manual use inside runner)
        run: |
          echo "Starting proxy on 0.0.0.0:8080 ..."
          PORT=8080 PROXY_USER=taezhnyyvolk PROXY_PASS='Volk_Taiga_2026_Krepkiy!' python3 severnyy_medved.py > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 3
          cat /tmp/proxy.log
          curl -s http://127.0.0.1:8080/health | head -3
          echo "Proxy ready (local only - public ingress is cloudflared)"

      - name: Start sing-box (VMess + WebSocket, the ONLY public leg)
        run: |
          echo "Installing sing-box ..."
          SB_VER="1.14.2"
          curl -sL --max-time 120 "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz" -o /tmp/sb.tgz
          tar xz -f /tmp/sb.tgz -C /tmp
          cp /tmp/sing-box-*/sing-box /tmp/sing-box && chmod +x /tmp/sing-box
          /tmp/sing-box version
          echo "Starting vmess-ws server on 127.0.0.1:10086 ..."
          /tmp/sing-box run -c matryoshka_dvigatel.json > /tmp/ss.log 2>&1 &
          echo $! > /tmp/ss.pid
          sleep 3
          cat /tmp/ss.log
          ss -tlnp | grep -E "10086|8080" || netstat -tlnp | grep -E "10086|8080" || true
          # GATE: the vmess inbound must be up (cloudflared dials it).
          if grep -q "vmess" /tmp/ss.log && (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -q ":10086"; then
            echo "vmess-ws listen OK (127.0.0.1:10086)"
          else
            echo "FATAL: vmess inbound did NOT start"
            cat /tmp/ss.log || true
            exit 1
          fi
          echo "--- local egress IP (should be US) ---"
          curl -s --max-time 15 -x 'http://taezhnyyvolk:Volk_Taiga_2026_Krepkiy!@127.0.0.1:8080' http://httpbin.org/ip || echo "LOCAL HTTP FAIL"
          echo ""

      - name: Install cloudflared
        run: |
          curl -sL --max-time 120 "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb" -o /tmp/cfd.deb
          sudo dpkg -i /tmp/cfd.deb
          cloudflared --version

      - name: Taezhnyy osmotr (sliyaniye reki)
        run: |
          _m1() {
            # Fixed URLs, evergreen content: volchiy_sled.txt (plain vmess://
            # link) and zayachiy_sled.txt (base64 subscription for v2rayNG/NekoBox
            # auto-update). The URLs never change; only the content tracks
            # the live tunnel hostname.
            CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$CF_HOST" ] && return 0
            UUID="$(python3 -c "import json;print(json.load(open('matryoshka_dvigatel.json'))['inbounds'][0]['users'][0]['uuid'])")"
            [ -z "$UUID" ] && return 0
            VJSON=$(printf '{"v":"2","ps":"VOLK-TAYGA","add":"%s","port":"443","id":"%s","aid":"0","net":"ws","type":"none","host":"%s","path":"/taiga","tls":"tls"}' "$CF_HOST" "$UUID" "$CF_HOST")
            LINK="vmess://$(printf '%s' "$VJSON" | base64 -w0)"
            printf '%s' "$LINK" > volchiy_sled.txt
            printf '%s' "$LINK" | base64 -w0 > zayachiy_sled.txt
            export VOLK_LINK="$LINK"
            echo "zayachiy_sled.txt + volchiy_sled.txt published (vmess link)"
          }
          _u2() {
            # Live block goes INSIDE the normal README (no separate file).
            # Needs <!--VOLK-ZHIVO-START--> / <!--VOLK-ZHIVO-END--> markers
            # (shipped in USER_README.md); appends them if ever missing.
            [ -z "$LINK" ] && LINK="$VOLK_LINK"
            [ -z "$LINK" ] && return 0
            export VOLK_LINK="$LINK"
            export VOLK_SUB="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/zayachiy_sled.txt"
            export VOLK_REPO="https://github.com/$GITHUB_REPOSITORY"
            python3 -c 'import os,re; block=("<!--VOLK-ZHIVO-START-->\n## Live connection (auto-updated, copy from here)\n\n- Repo: "+os.environ["VOLK_REPO"]+"\n\n- v2rayNG link (copy/QR, TLS+WebSocket via Cloudflare):\n```\n"+os.environ["VOLK_LINK"]+"\n```\n\n- Subscription (fixed forever, auto-updates):\n```\n"+os.environ["VOLK_SUB"]+"\n```\n<!--VOLK-ZHIVO-END-->"); s=open("README.md",encoding="utf-8").read(); pat=re.compile(r"<!--VOLK-ZHIVO-START-->.*?<!--VOLK-ZHIVO-END-->",re.S); s=pat.sub(block,s,count=1) if pat.search(s) else s+"\n"+block+"\n"; open("README.md","w",encoding="utf-8").write(s); print("README live block updated")'
          }
          echo "Starting cloudflared quick tunnel to vmess-ws ..."
          rm -f /tmp/cf.log
          cloudflared tunnel --url http://localhost:10086 > /tmp/cf.log 2>&1 &
          echo $! > /tmp/cf.pid
          CF_HOST=""
          for _w in $(seq 1 12); do
            sleep 10
            CF_HOST=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/cf.log 2>/dev/null | head -1 | sed 's|https://||')
            if [ -n "$CF_HOST" ]; then break; fi
            echo "tunnel URL not yet published ($_w/12) - waiting ..."
          done
          cat /tmp/cf.log
          if [ -z "$CF_HOST" ]; then echo "FATAL: cloudflared gave no URL"; exit 1; fi
          echo "$CF_HOST" > medvezhiy_sled.txt
          echo "TUNNEL: $CF_HOST"
          _m1
          _u2
          git config user.name "medved-bot"
          git config user.email "bot@taiga.volk"
          git pull --rebase --autostash || true
          # Bury the dead transports: remove their endpoint files + mesh key.
          git rm --quiet bore_url.txt ss_url.txt ss_ygg_url.txt proxy_urls.txt 2>/dev/null || true
          git rm -r --quiet ygg-node 2>/dev/null || true
          git add medvezhiy_sled.txt volchiy_sled.txt zayachiy_sled.txt README.md || true
          git commit -m "publish cloudflared $CF_HOST" || true
          git push || true
          echo "### CLOUDFLARE: $CF_HOST" >> $GITHUB_STEP_SUMMARY

      - name: Taezhnaya proverka (sled volka)
        run: |
          CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
          [ -z "$CF_HOST" ] && { echo "FATAL: no tunnel hostname"; exit 1; }
          UUID="$(python3 -c "import json;print(json.load(open('matryoshka_dvigatel.json'))['inbounds'][0]['users'][0]['uuid'])")"
          printf '{"log":{"level":"info"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1082}],"outbounds":[{"type":"vmess","tag":"out","server":"%s","server_port":443,"uuid":"%s","alter_id":0,"tls":{"enabled":true,"server_name":"%s"},"transport":{"type":"ws","path":"/taiga","headers":{"Host":"%s"}}}]}' "$CF_HOST" "$UUID" "$CF_HOST" "$CF_HOST" > /tmp/sb-sled.json
          /tmp/sing-box run -c /tmp/sb-sled.json > /tmp/sb-cf.log 2>&1 &
          sleep 3
          echo "--- vmess: http via socks-1082 (single probe) ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:1082 http://httpbin.org/ip && echo "" && echo "CF LEG OK (real traffic)" || { echo "FATAL: CF LEG FAIL"; tail -20 /tmp/sb-cf.log || true; tail -20 /tmp/cf.log || true; exit 1; }
          pkill -f sb-sled.json 2>/dev/null || true
          echo "ALL LOOPBACK TESTS OK"

      - name: Zimnyaya storozhka (nochnoy dozor)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          _m0() {
            CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$CF_HOST" ] && return 0
            UUID="$(python3 -c "import json;print(json.load(open('matryoshka_dvigatel.json'))['inbounds'][0]['users'][0]['uuid'])")"
            [ -z "$UUID" ] && return 0
            VJSON=$(printf '{"v":"2","ps":"VOLK-TAYGA","add":"%s","port":"443","id":"%s","aid":"0","net":"ws","type":"none","host":"%s","path":"/taiga","tls":"tls"}' "$CF_HOST" "$UUID" "$CF_HOST")
            LINK="vmess://$(printf '%s' "$VJSON" | base64 -w0)"
            printf '%s' "$LINK" > volchiy_sled.txt
            printf '%s' "$LINK" | base64 -w0 > zayachiy_sled.txt
          }
          _p1() {
            # $1 = reason label (handover | heal)
            _m0
            git config user.name "medved-bot" || true
            git config user.email "bot@taiga.volk" || true
            git pull --rebase --autostash || true
            git rm --quiet bore_url.txt ss_url.txt ss_ygg_url.txt proxy_urls.txt 2>/dev/null || true
            git rm -r --quiet ygg-node 2>/dev/null || true
            git add medvezhiy_sled.txt volchiy_sled.txt zayachiy_sled.txt README.md || true
            git commit -m "cloudflare ${1:-update} [$(cat medvezhiy_sled.txt 2>/dev/null)]" || true
            git push || true
          }
          # Monitor: persistent vmess-over-cloudflared on 1081,
          # rebuilt whenever the published hostname changes. Real
          # end-to-end traffic (not a TCP ping) decides health.
          _s2() {
            _h="$1"
            UUID="$(python3 -c "import json;print(json.load(open('matryoshka_dvigatel.json'))['inbounds'][0]['users'][0]['uuid'])")"
            printf '{"log":{"level":"error"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1081}],"outbounds":[{"type":"vmess","tag":"out","server":"%s","server_port":443,"uuid":"%s","alter_id":0,"tls":{"enabled":true,"server_name":"%s"},"transport":{"type":"ws","path":"/taiga","headers":{"Host":"%s"}}}]}' "$_h" "$UUID" "$_h" "$_h" > /tmp/sb-dozor.json
            pkill -f sb-dozor.json 2>/dev/null || true
            sleep 1
            /tmp/sing-box run -c /tmp/sb-dozor.json > /tmp/sb-dozitor.log 2>&1 &
            echo "$_h" > /tmp/sldozor.ep
            sleep 2
            echo "monitor (re)started on 1081 -> $_h"
          }
          _v3() {
            # Single lightweight probe per tick (was 2) to stay under rate limits.
            # 429 = edge concurrency cap -> rotate now.
            _c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --socks5-hostname 127.0.0.1:1081 http://httpbin.org/ip 2>/dev/null || echo "000")
            if [ "$_c" = "429" ]; then
              echo "edge 429 (concurrency cap) - rotating now"
              return 1
            fi
            [ "$_c" = "200" ] && return 0
            return 1
          }
          _r4() {
            # New quick tunnel = new random hostname. Old one stays briefly
            # (cloudflared keeps serving until killed + edge drains), the
            # client follows the republished file within a minute.
            echo "RESTARTING cloudflared tunnel ..."
            kill $(cat /tmp/cf.pid) 2>/dev/null || true
            sleep 2
            rm -f /tmp/cf.log
            cloudflared tunnel --url http://localhost:10086 > /tmp/cf.log 2>&1 &
            echo $! > /tmp/cf.pid
            CF_NEW=""
            for _w in $(seq 1 12); do
              sleep 10
              CF_NEW=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/cf.log 2>/dev/null | head -1 | sed 's|https://||')
              if [ -n "$CF_NEW" ]; then break; fi
              echo "new tunnel URL not yet published ($_w/12) ..."
            done
            if [ -z "$CF_NEW" ]; then
              echo "new tunnel failed - keeping old endpoint file"
              cat /tmp/cf.log || true
              return 1
            fi
            echo "$CF_NEW" > medvezhiy_sled.txt
            echo "new tunnel: $CF_NEW"
            return 0
          }
          _s2 "$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
          fail_cf=0; _trouble=0
          for i in $(seq 1 260); do
            echo "[$i/260] $(date -u) - alive"
            # --- generational handover (first iteration only) ---
            if [ "$i" -eq 1 ]; then
              for _rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
                  --workflow sibirskiy_medved.yml --status in_progress --limit 10 \
                  --json databaseId -q '.[].databaseId' 2>/dev/null); do
                if [ -n "$_rid" ] && [ "$_rid" -lt "$GITHUB_RUN_ID" ] 2>/dev/null; then
                  echo "retiring older run $_rid (our tunnel verified+published) ..."
                  gh run cancel "$_rid" --repo "$GITHUB_REPOSITORY" || true
                fi
              done
              _p1 "handover"
              echo "HANDOVER: predecessors retired, own endpoint republished."
            fi
            CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
            # Silent healthy ticks: publish status only every 4th tick to cut log/API noise.
            # Proxy traffic itself is untouched (zero user impact).
            if [ $((i % 4)) -eq 1 ]; then echo "CLOUDFLARE: ${CF_HOST:-none}"; fi
            _pids=""
            for svc in "ss:/tmp/ss.pid" "cf:/tmp/cf.pid"; do
              name=$(echo $svc | cut -d: -f1); pidf=$(echo $svc | cut -d: -f2)
              if kill -0 $(cat $pidf) 2>/dev/null; then _pids="$_pids $name=ok"; else _pids="$_pids $name=DEAD"; _trouble=1; fi
            done
            if pgrep -f sb-dozor.json >/dev/null 2>&1; then _pids="$_pids sldozor=ok"; else _pids="$_pids sldozor=DEAD"; _trouble=1; fi
            (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -q ":10086" || { echo "vmess listen DEAD"; _trouble=1; }
            # Rebuild the monitor if it died or the hostname changed.
            if ! pgrep -f sb-dozor.json >/dev/null 2>&1 \
              || [ "$(cat /tmp/sldozor.ep 2>/dev/null)" != "$CF_HOST" ]; then
              [ -n "$CF_HOST" ] && _s2 "$CF_HOST"
            fi
            if _v3; then
              fail_cf=0
              if [ $((i % 4)) -eq 1 ]; then echo "public vmess end-to-end ok"; fi
            else
              echo "public vmess end-to-end FAIL ($((fail_cf+1)))"; fail_cf=$((fail_cf+1)); _trouble=1
            fi
            # --- auto-heal on FIRST failure: fresh tunnel + republish ---
            if [ "$fail_cf" -ge 1 ]; then
              if _r4; then
                CF_HOST="$(cat medvezhiy_sled.txt 2>/dev/null | tr -d ' \r\n')"
                _s2 "$CF_HOST"
                if _v3; then
                  _p1 "heal"
                  echo "HEALED: new tunnel $CF_HOST verified end-to-end"
                else
                  echo "new tunnel up but traffic dead - will retry next round"
                fi
              else
                echo "tunnel restart failed - will retry next round"
              fi
              fail_cf=0
            fi
            # Diagnostics ONLY on trouble (healthy loops stay one screen).
            if [ "$_trouble" -eq 1 ]; then
              _trouble=0
              echo "--- ss.log tail ---"; tail -5 /tmp/ss.log || true
              echo "--- cf.log tail ---"; tail -10 /tmp/cf.log || true
              echo "--- sb-dozitor.log tail ---"; tail -5 /tmp/sb-dozitor.log || true
            fi
            sleep 60
          done
