name: USA Proxy (GitHub Actions + Yggdrasil mesh)

on:
  workflow_dispatch:
  schedule:
    # Every 4h a new generation starts: it verifies + publishes its own
    # mesh endpoint first, then retires the older run (overlapping
    # handover, no gap). The mesh identity is stable (key adopted from
    # the repo), so clients never notice the rotation.
    - cron: '0 */4 * * *'
  push:
    # ZIP-manual setup: starts right after upload. Bot commits (*.txt,
    # *.md) never match these code paths, so no self-trigger loop.
    paths:
      - "singbox-server.json"
      - ".github/workflows/proxy.yml"

permissions:
  contents: write
  actions: write  # retire step cancels the older run after handover

# Generational handover (NOT cancel-on-start): the new run verifies +
# publishes its own endpoint first, then retires the older run. Killing
# the old run at startup would open a setup gap every cycle.
concurrency:
  group: usa-proxy
  cancel-in-progress: false

jobs:
  proxy:
    # Never run on the template repo itself (schedule would burn minutes
    # and push endpoint files to main). User copies run elsewhere.
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Shadowsocks (encrypted, serves the mesh on IPv6)
        run: |
          echo "Installing sing-box ..."
          SB_VER="1.14.2"
          curl -sL --max-time 120 "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz" -o /tmp/sb.tgz
          tar xz -f /tmp/sb.tgz -C /tmp
          cp /tmp/sing-box-*/sing-box /tmp/sing-box && chmod +x /tmp/sing-box
          /tmp/sing-box version
          echo "Starting ss server on [::]:8388 (dual-stack IPv4+IPv6, mesh needs IPv6) ..."
          /tmp/sing-box run -c singbox-server.json > /tmp/ss.log 2>&1 &
          echo $! > /tmp/ss.pid
          sleep 3
          cat /tmp/ss.log
          ss -tlnp | grep -E "8388" || netstat -tlnp | grep -E "8388" || true
          # HARD GATE: the mesh leg is IPv6-only. Trust sing-box's own
          # log (this runner's `ss` renders [::]:8388 as *:8388).
          if grep -q "tcp server started at \[::\]:8388" /tmp/ss.log; then
            echo "ss dual-stack listen OK ([::]:8388 serves the mesh)"
          else
            echo "FATAL: ss did NOT bind [::]:8388 - mesh leg would be dead"
            cat /tmp/ss.log || true
            ss -tln || netstat -tln || true
            exit 1
          fi

      - name: Start Yggdrasil mesh node (the ONLY transport)
        run: |
          # Our own mesh node with a fixed IPv6 (key kept in ./ygg-node,
          # adopted from the repo when present, committed back otherwise).
          # The ss server on [::]:8388 answers the mesh - one secret.
          echo "Installing yggdrasil ..."
          YGG_VER="0.5.14"
          curl -sL --max-time 120 "https://github.com/yggdrasil-network/yggdrasil-go/releases/download/v${YGG_VER}/yggdrasil-${YGG_VER}-amd64.deb" -o /tmp/ygg.deb
          sudo dpkg -i /tmp/ygg.deb
          yggdrasil --version
          mkdir -p ygg-node
          # Overlapping generations check out BEFORE the predecessor
          # commits its key - adopt the latest COMMITTED key first so one
          # stable identity (one mesh IP) survives across generations.
          # VERDICT (visible in log + run summary, no guessing):
          git fetch origin main --depth 1 2>/dev/null || true
          if git checkout origin/main -- ygg-node/ygg.conf 2>/dev/null \
            && [ -f ygg-node/ygg.conf ]; then
            echo "ygg.conf: ADOPTED committed identity (stable mesh IP across generations)"
            echo "### YGG_IDENTITY: adopted (stable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ygg.conf: NO committed identity on main - fresh key will be generated (first run ever?)"
            echo "### YGG_IDENTITY: fresh (first run?)" >> $GITHUB_STEP_SUMMARY
          fi
          # Key posture: the key is public in the repo - same as the
          # public ss password. Anyone may use the proxy; worst case is
          # impersonation noise, not data theft (Shadowsocks encryption
          # is a separate layer). Same key => same mesh IP forever
          # (phone configured once, DHT entries persist).
          if [ ! -f ygg-node/ygg.conf ]; then
            (cd ygg-node && yggdrasil -genconf > ygg.conf)
            python3 - <<'EOF'
          peers = ["tls://mn.us.ygg.triplebit.org:993",
                   "tls://marisa.nadeko.net:44442",
                   "tls://ygg.mnpnk.com:443"]
          p = "ygg-node/ygg.conf"
          s = open(p).read()
          s = s.replace("Peers: []", "Peers: [\n" + "\n".join("    " + x for x in peers) + "\n  ]")
          # explicit TCP admin: the .deb default is a root-owned unix socket
          # that unprivileged yggdrasilctl cannot touch
          s = s.rstrip()
          assert s.endswith("}"), "yggdrasil genconf shape changed!"
          s = s[:-1] + "\nAdminListen: tcp://127.0.0.1:9001\n" + "}\n"
          open(p, "w").write(s)
          print("ygg.conf: fresh node identity + 3 public peers")
          EOF
          else
            echo "ygg.conf: reusing committed identity (IP stays stable)"
          fi
          sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
          sleep 2
          pgrep -f "yggdrasil -useconffile" | head -1 | sudo tee /tmp/ygg.pid > /dev/null
          sleep 20
          cat /tmp/ygg.log
          # Ygg mesh range is 200::/7 -> addresses start with 2xxx OR 3xxx
          YGG_IP=$(yggdrasilctl -endpoint tcp://127.0.0.1:9001 getSelf 2>/dev/null | grep -v "/64" | grep -oE "[23][0-9a-f]{2}:[0-9a-f:]+:[0-9a-f]+" | head -1)
          # GATE: publish the mesh endpoint ONLY if the node really peered
          # AND the ss server really listens. There is no fallback leg any
          # more - an unverified run must die loudly, not serve ghosts.
          YGG_OK=0
          if [ -n "$YGG_IP" ]; then
            for _w in $(seq 1 6); do
              if yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers 2>/dev/null | grep -q " Up "; then
                YGG_OK=1; break
              fi
              echo "ygg mesh not peered yet ($_w/6) - waiting ..."
              sleep 10
            done
          fi
          if [ "$YGG_OK" -eq 1 ] && (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -q ":8388"; then
            echo "YGG node peered + ss listening - publishing mesh endpoint"
            yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers || true
            echo "[$YGG_IP]:8388" > ss_ygg_url.txt
          else
            echo "FATAL: YGG leg NOT verified (peered=$YGG_OK) - no fallback exists, failing the run"
            exit 1
          fi
          cat ss_ygg_url.txt || true
          echo "### YGG_MESH: $(cat ss_ygg_url.txt 2>/dev/null)" >> $GITHUB_STEP_SUMMARY

      - name: Publish mesh endpoint (link + subscription + README)
        run: |
          make_sub() {
            # Fixed URLs, evergreen content: android-ss.txt (plain ss://
            # link) and sub.txt (base64 subscription for v2rayNG/NekoBox
            # auto-update). The URLs never change; only the content tracks
            # the live mesh endpoint (stable identity => rarely changes).
            YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$YGG_URL" ] && return 0
            YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
            YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
            PASS="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0]['password'])")"
            METHOD="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0].get('method','aes-256-gcm'))")"
            [ -z "$PASS" ] && return 0
            [ -z "$YGG_HOST" ] || [ -z "$YGG_PORT" ] && return 0
            USERINFO="$(printf '%s' "$METHOD:$PASS" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
            LINK="ss://${USERINFO}@[${YGG_HOST}]:${YGG_PORT}#IPNET-USA-YGG"
            printf '%s' "$LINK" > android-ss.txt
            printf '%s' "$LINK" | base64 -w0 > sub.txt
            echo "sub.txt + android-ss.txt published (mesh link)"
          }
          update_readme() {
            # Live block goes INSIDE the normal README (no separate file).
            # Needs <!--IPNET-LIVE-START--> / <!--IPNET-LIVE-END--> markers
            # (shipped in USER_README.md); appends them if ever missing.
            [ -z "$LINK" ] && return 0
            export IPNET_LINK="$LINK"
            export IPNET_SUB="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/sub.txt"
            export IPNET_REPO="https://github.com/$GITHUB_REPOSITORY"
            python3 -c 'import os; block=("<!--IPNET-LIVE-START-->\n## Live connection (auto-updated, copy from here)\n\n- Repo: "+os.environ["IPNET_REPO"]+"\n\n- Mesh link (Yggdrasil app + v2rayNG, stable address):\n```\n"+os.environ["IPNET_LINK"]+"\n```\n\n- Subscription (fixed forever, auto-updates):\n```\n"+os.environ["IPNET_SUB"]+"\n```\n<!--IPNET-LIVE-END-->"); s=open("README.md",encoding="utf-8").read(); import re; pat=re.compile(r"<!--IPNET-LIVE-START-->.*?<!--IPNET-LIVE-END-->",re.S); s=pat.sub(block,s,count=1) if pat.search(s) else s+"\n"+block+"\n"; open("README.md","w",encoding="utf-8").write(s); print("README live block updated")'
          }
          make_sub
          update_readme
          git config user.name "proxy-bot"
          git config user.email "bot@proxy.usa"
          git pull --rebase --autostash || true
          git rm --quiet bore_url.txt ss_url.txt proxy_urls.txt 2>/dev/null || true
          git add ss_ygg_url.txt android-ss.txt sub.txt README.md || true
          git add -f ygg-node/ygg.conf 2>/dev/null || true
          git commit -m "publish mesh $(cat ss_ygg_url.txt 2>/dev/null)" || true
          git push || true
          echo "### MESH: $(cat ss_ygg_url.txt 2>/dev/null)" >> $GITHUB_STEP_SUMMARY

      - name: Mesh loopback test (Shadowsocks over ygg, end-to-end)
        run: |
          echo "=== Testing Shadowsocks through MESH (ygg) leg ==="
          YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
          if [ -z "$YGG_URL" ]; then echo "FATAL: no mesh endpoint published"; exit 1; fi
          YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
          YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
          echo "--- ygg L3: raw TCP to [$YGG_HOST]:$YGG_PORT via mesh ---"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$YGG_HOST/$YGG_PORT" \
            && echo "YGG L3 TCP OK" || { echo "FATAL: YGG L3 TCP FAIL"; exit 1; }
          echo "--- ygg L7: ss handshake + http via socks-1082 ---"
          printf '{"log":{"level":"info"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1082}],"outbounds":[{"type":"shadowsocks","tag":"out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$YGG_HOST" "$YGG_PORT" > /tmp/sb-ygg.json
          /tmp/sing-box run -c /tmp/sb-ygg.json > /tmp/sb-ygg.log 2>&1 &
          sleep 3
          curl -s --max-time 30 --socks5-hostname 127.0.0.1:1082 http://httpbin.org/ip && echo "" && echo "YGG LEG OK (real traffic over mesh)" || { echo "FATAL: YGG LEG FAIL"; tail -20 /tmp/sb-ygg.log || true; exit 1; }
          echo "--- ipinfo (should be US) ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:1082 https://ipinfo.io/json | head -12 || true
          pkill -f sb-ygg.json 2>/dev/null || true
          echo "MESH TESTS OK"

      - name: Keep alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make_sub() {
            YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$YGG_URL" ] && return 0
            YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
            YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
            PASS="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0]['password'])")"
            METHOD="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0].get('method','aes-256-gcm'))")"
            [ -z "$PASS" ] && return 0
            [ -z "$YGG_HOST" ] || [ -z "$YGG_PORT" ] && return 0
            USERINFO="$(printf '%s' "$METHOD:$PASS" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
            LINK="ss://${USERINFO}@[${YGG_HOST}]:${YGG_PORT}#IPNET-USA-YGG"
            printf '%s' "$LINK" > android-ss.txt
            printf '%s' "$LINK" | base64 -w0 > sub.txt
          }
          push_urls() {
            # $1 = reason label (handover | ygg-republish)
            make_sub
            git config user.name "proxy-bot" || true
            git config user.email "bot@proxy.usa" || true
            git pull --rebase --autostash || true
            git rm --quiet bore_url.txt ss_url.txt proxy_urls.txt 2>/dev/null || true
            git add ss_ygg_url.txt android-ss.txt sub.txt README.md || true
            git add -f ygg-node/ygg.conf 2>/dev/null || true
            git commit -m "mesh ${1:-update} [$(cat ss_ygg_url.txt 2>/dev/null)]" || true
            git push || true
          }
          ygg_check() {
            # reports: ok | restarted | dead  (same run key => same mesh IP)
            if pgrep -f "yggdrasil -useconffile" >/dev/null 2>&1; then
              echo ok; return 0
            fi
            echo "ygg node dead - restarting with SAME run identity ..." >&2
            sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
            sleep 20
            if pgrep -f "yggdrasil -useconffile" >/dev/null 2>&1; then
              echo restarted; return 0
            fi
            echo dead; return 1
          }
          ygg_publish() {
            # refresh ss_ygg_url.txt from the live node; republish on change.
            # Publish ONLY while peered - never broadcast an unroutable ghost.
            if ! yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers 2>/dev/null | grep -q " Up "; then
              echo "ygg not peered - publish skipped (file keeps last value)"
              return 1
            fi
            _ip=$(yggdrasilctl -endpoint tcp://127.0.0.1:9001 getSelf 2>/dev/null | grep -v "/64" | grep -oE "[23][0-9a-f]{2}:[0-9a-f:]+:[0-9a-f]+" | head -1)
            [ -z "$_ip" ] && return 1
            _cur="[${_ip}]:8388"
            if [ "$(cat ss_ygg_url.txt 2>/dev/null)" != "$_cur" ]; then
              echo "$_cur" > ss_ygg_url.txt
              push_urls "ygg-republish"
              echo "YGG endpoint (re)published: $_cur"
            fi
            return 0
          }
          # Mid-run churn detector: same key => same mesh IP, ALWAYS.
          _ygg_birth="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
          _ygg_churn_warned=0
          for i in $(seq 1 600); do
            echo "[$i/600] $(date -u) - alive"
            # --- generational handover (first iteration only) ---
            # Old run keeps serving while this run prepared + published its
            # own endpoint. Now: retire older runs, then REPUBLISH our own
            # files so no stale content can point at the dying generation.
            if [ "$i" -eq 1 ]; then
              for _rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
                  --workflow proxy.yml --status in_progress --limit 10 \
                  --json databaseId -q '.[].databaseId' 2>/dev/null); do
                if [ -n "$_rid" ] && [ "$_rid" -lt "$GITHUB_RUN_ID" ] 2>/dev/null; then
                  echo "retiring older run $_rid (our endpoint verified+published) ..."
                  gh run cancel "$_rid" --repo "$GITHUB_REPOSITORY" || true
                fi
              done
              ygg_publish || true
              push_urls "handover"
              echo "HANDOVER: predecessors retired, own endpoint republished."
            fi
            echo "YGG: $(cat ss_ygg_url.txt 2>/dev/null || echo none)"
            if kill -0 $(cat /tmp/ss.pid) 2>/dev/null; then echo "pids: ss=ok"; else echo "pids: ss=DEAD"; fi
            (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -q ":8388" && echo "ss listen ok" || echo "ss listen DEAD"
            _ygg_st=$(ygg_check) && echo "ygg node: $_ygg_st" || echo "ygg node: dead"
            if [ "$_ygg_st" != "dead" ]; then ygg_publish || echo "ygg publish skipped"; fi
            _ycur="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            if [ "$_ygg_churn_warned" -eq 0 ] && [ -n "$_ygg_birth" ] \
              && [ -n "$_ycur" ] && [ "$_ycur" != "$_ygg_birth" ]; then
              _ygg_churn_warned=1
              echo "WARNING: YGG endpoint changed MID-RUN "
              echo "  birth: $_ygg_birth"
              echo "  now:   $_ycur"
              echo "  (identity churn - client mesh routes must reconverge!)"
              echo "### YGG_CHURN: endpoint changed mid-run!" >> $GITHUB_STEP_SUMMARY
            fi
            # --- mesh leg: traffic test, auto-heal (restart node, same key) ---
            # (process-alive is NOT enough: the mesh can stall while the
            # daemon runs. Same key on restart => same mesh IP.)
            _yep="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            _ygg_bad=0
            if [ -n "$_yep" ]; then
              # one persistent monitor (1083); (re)started only if its own
              # process died OR the published ygg endpoint changed
              if ! pgrep -f sb-yggmon.json >/dev/null 2>&1 \
                || [ "$(cat /tmp/sb-yggmon.ep 2>/dev/null)" != "$_yep" ]; then
                _yh="$(echo "$_yep" | sed 's/^\[//;s/\].*//')"
                _yp="$(echo "$_yep" | sed 's/.*\]://')"
                printf '{"log":{"level":"error"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1083}],"outbounds":[{"type":"shadowsocks","tag":"out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$_yh" "$_yp" > /tmp/sb-yggmon.json
                /tmp/sing-box run -c /tmp/sb-yggmon.json > /tmp/sb-yggmon.log 2>&1 &
                sleep 2
                echo "$_yep" > /tmp/sb-yggmon.ep
                echo "ygg monitor (re)started on 1083"
              fi
              if curl -s --max-time 10 --socks5-hostname 127.0.0.1:1083 http://httpbin.org/ip >/dev/null 2>&1 \
                || curl -s --max-time 10 --socks5-hostname 127.0.0.1:1083 http://ipinfo.io/ip >/dev/null 2>&1; then
                echo "public YGG end-to-end ok"
              else
                _ygg_bad=1
                echo "public YGG end-to-end FAIL - restarting mesh node (same key) ..."
                sudo pkill -f "yggdrasil -useconffile" 2>/dev/null || true
                sleep 2
                sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
                sleep 15
                ygg_publish || echo "ygg republish skipped"
                echo "ygg node restarted after traffic failure"
              fi
            else
              _ygg_bad=1
              echo "no ygg endpoint published - mesh down"
            fi
            # Diagnostics ONLY on trouble (healthy loops stay one screen).
            if [ "$_ygg_bad" -eq 1 ]; then
              echo "--- ss.log tail ---"; tail -5 /tmp/ss.log || true
              echo "--- ygg.log tail ---"; tail -10 /tmp/ygg.log || true
              echo "--- sb-yggmon.log tail ---"; tail -5 /tmp/sb-yggmon.log || true
            fi
            sleep 20
          done
