name: USA Proxy (GitHub Actions + bore)

on:
  workflow_dispatch:
  schedule:
    # كل 4 ساعات: يبدأ جيل جديد، وبعد ما أنفاقه تتأكد وتنتشر
    # هو اللي يقتل الجيل القديم (تسليم متداخل، بدون فجوة)
    - cron: '0 */4 * * *'
  push:
    # ZIP-manual setup: starts right after upload. Bot commits (*.txt,
    # *.md) never match these code paths, so no self-trigger loop.
    paths:
      - "server.py"
      - "singbox-server.json"
      - ".github/workflows/proxy.yml"

permissions:
  contents: write
  actions: write  # retire step cancels the older run after handover

# Generational handover (NOT cancel-on-start): the new run verifies +
# publishes its own tunnels first, then retires the older run. Killing
# the old run at startup would open a setup gap every cycle.
concurrency:
  group: usa-proxy
  cancel-in-progress: false

jobs:
  proxy:
    # Never run on the template repo itself (schedule would burn minutes
    # and push endpoint files to main). User copies run elsewhere.
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 ساعات
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start proxy
        run: |
          echo "Starting proxy on 0.0.0.0:8080 ..."
          PORT=8080 PROXY_USER=x5coder PROXY_PASS='X5_Secure_2026!Strong' python3 server.py > /tmp/proxy.log 2>&1 &
          echo $! > /tmp/proxy.pid
          sleep 3
          cat /tmp/proxy.log
          curl -s http://127.0.0.1:8080/health | head -5
          echo "Proxy ready"
          echo "=== LOCAL PROXY SELF-TEST (inside runner) ==="
          echo "--- http via localhost proxy ---"
          curl -s --max-time 15 -x 'http://x5coder:X5_Secure_2026!Strong@127.0.0.1:8080' http://httpbin.org/ip || echo "LOCAL HTTP FAIL"
          echo ""
          echo "--- https via localhost proxy (CONNECT) ---"
          curl -s --max-time 20 -x 'http://x5coder:X5_Secure_2026!Strong@127.0.0.1:8080' https://httpbin.org/ip || echo "LOCAL HTTPS FAIL"
          echo ""
          echo "--- runner egress ip (should be US) ---"
          curl -s --max-time 10 https://ipinfo.io/json | head -12 || true

      - name: Start Shadowsocks (encrypted - bypasses CONNECT DPI block)
        run: |
          echo "Installing sing-box ..."
          SB_VER="1.14.2"
          curl -sL --max-time 120 "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz" -o /tmp/sb.tgz
          tar xz -f /tmp/sb.tgz -C /tmp
          cp /tmp/sing-box-*/sing-box /tmp/sing-box && chmod +x /tmp/sing-box
          /tmp/sing-box version
          echo "Starting ss server on :::8388 (dual-stack: bore IPv4 + ygg IPv6) ..."
          /tmp/sing-box run -c singbox-server.json > /tmp/ss.log 2>&1 &
          echo $! > /tmp/ss.pid
          sleep 3
          cat /tmp/ss.log
          ss -tlnp | grep -E "8388|8080" || netstat -tlnp | grep -E "8388|8080" || true
          # HARD GATE: the mesh leg is IPv6 - an IPv4-only listen (0.0.0.0)
          # silently kills 100% of ygg traffic. Refuse to continue blind.
          # NOTE: trust sing-box's own log here, not `ss` text format:
          # this runner's iproute2 renders the IPv6 wildcard [::]:8388 as
          # `*:8388`, so grepping `ss` output for `:::8388` is a false
          # negative (observed: log says `[::]:8388` while `ss` prints `*`).
          if grep -q "tcp server started at \[::\]:8388" /tmp/ss.log; then
            echo "ss dual-stack listen OK ([::]:8388 serves bore + mesh)"
          else
            echo "FATAL: ss did NOT bind [::]:8388 (dual-stack broken) - ygg leg would be dead"
            cat /tmp/ss.log || true
            ss -tln || netstat -tln || true
            exit 1
          fi

      - name: Start Yggdrasil mesh node (stable second transport)
        run: |
          # Second public leg next to bore: our own mesh node with a fixed
          # IPv6 for the whole run (key kept in ./ygg-node, reused on
          # restarts so the IP never changes mid-run). The same ss server
          # on [::]:8388 answers both bore and mesh - one secret, two
          # doors. Clients prefer ygg (stable), bore stays as fallback.
          echo "Installing yggdrasil ..."
          YGG_VER="0.5.14"
          curl -sL --max-time 120 "https://github.com/yggdrasil-network/yggdrasil-go/releases/download/v${YGG_VER}/yggdrasil-${YGG_VER}-amd64.deb" -o /tmp/ygg.deb
          sudo dpkg -i /tmp/ygg.deb
          yggdrasil --version
          mkdir -p ygg-node
          # Overlapping generations (cron every 4h, runs live ~5h) check
          # out BEFORE the predecessor commits its key, so every run
          # minted a fresh key and the mesh IP churned each generation
          # (observed: 'create mode ygg-node/ygg.conf' twice in a row -
          # and DHT routes can never converge to a moving target).
          # Adopt the latest COMMITTED key first: narrows the race to
          # seconds and keeps ONE stable identity across generations.
          # VERDICT (visible in log + run summary, no guessing):
          git fetch origin main --depth 1 2>/dev/null || true
          if git checkout origin/main -- ygg-node/ygg.conf 2>/dev/null \
            && [ -f ygg-node/ygg.conf ]; then
            echo "ygg.conf: ADOPTED committed identity (stable mesh IP across generations)"
            echo "### YGG_IDENTITY: adopted (stable)" >> $GITHUB_STEP_SUMMARY
          else
            echo "ygg.conf: NO committed identity on main - fresh key will be generated (first run ever?)"
            echo "### YGG_IDENTITY: fresh (first run?)" >> $GITHUB_STEP_SUMMARY
          fi
          # Key posture (unchanged): the key is public in the repo - same
          # as the public ss password. Anyone may use the proxy; worst
          # case is impersonation noise, not data theft (Shadowsocks
          # encryption is a separate layer). Same key => same mesh IP
          # forever (phone configured once, DHT entries persist).
          if [ ! -f ygg-node/ygg.conf ]; then
            (cd ygg-node && yggdrasil -genconf > ygg.conf)
            python3 - <<'EOF'
          peers = ["tls://mn.us.ygg.triplebit.org:993",
                   "tls://marisa.nadeko.net:44442",
                   "tls://ygg.mnpnk.com:443"]
          p = "ygg-node/ygg.conf"
          s = open(p).read()
          s = s.replace("Peers: []", "Peers: [\n" + "\n".join("    " + x for x in peers) + "\n  ]")
          # explicit TCP admin: the .deb default is a root-owned unix socket
          # that unprivileged yggdrasilctl cannot touch
          s = s.rstrip()
          assert s.endswith("}"), "yggdrasil genconf shape changed!"
          s = s[:-1] + "\nAdminListen: tcp://127.0.0.1:9001\n" + "}\n"
          open(p, "w").write(s)
          print("ygg.conf: fresh node identity + 3 public peers")
          EOF
          else
            echo "ygg.conf: reusing run identity (IP stays stable)"
          fi
          sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
          sleep 2
          pgrep -f "yggdrasil -useconffile" | head -1 | sudo tee /tmp/ygg.pid > /dev/null
          sleep 20
          cat /tmp/ygg.log
          # Ygg mesh range is 200::/7 -> addresses start with 2xxx OR 3xxx
          YGG_IP=$(yggdrasilctl -endpoint tcp://127.0.0.1:9001 getSelf 2>/dev/null | grep -v "/64" | grep -oE "[23][0-9a-f]{2}:[0-9a-f:]+:[0-9a-f]+" | head -1)
          # GATE: publish the mesh endpoint ONLY if the node really peered
          # AND the ss server really listens - otherwise an unroutable ghost
          # IP would be published and clients would chase a dead leg.
          YGG_OK=0
          if [ -n "$YGG_IP" ]; then
            for _w in $(seq 1 6); do
              if yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers 2>/dev/null | grep -q " Up "; then
                YGG_OK=1; break
              fi
              echo "ygg mesh not peered yet ($_w/6) - waiting ..."
              sleep 10
            done
          fi
          if [ "$YGG_OK" -eq 1 ] && (ss -tln 2>/dev/null || netstat -tln 2>/dev/null) | grep -q ":8388"; then
            echo "YGG node peered + ss listening - publishing mesh endpoint"
            yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers || true
            echo "[$YGG_IP]:8388" > ss_ygg_url.txt
          else
            echo "YGG leg NOT verified (peered=$YGG_OK) - publishing EMPTY, bore carries alone"
            echo "" > ss_ygg_url.txt
          fi
          cat ss_ygg_url.txt || true
          echo "### YGG_MESH: $(cat ss_ygg_url.txt 2>/dev/null)" >> $GITHUB_STEP_SUMMARY

      - name: Install bore
        run: |
          set -x
          rm -f /tmp/bore /tmp/bore.tar.gz
          if curl -sL --max-time 60 https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/bore.tar.gz; then
            if tar tzf /tmp/bore.tar.gz >/dev/null 2>&1; then
              tar xz -f /tmp/bore.tar.gz -C /tmp && chmod +x /tmp/bore && echo "bore binary ok"
            else
              echo "tar invalid, fallback cargo"; rm -f /tmp/bore
            fi
          fi
          if [ ! -x /tmp/bore ]; then
            cargo install bore-cli && cp ~/.cargo/bin/bore /tmp/bore
          fi
          /tmp/bore --version

      - name: Start bore tunnels (http-proxy 8080 + shadowsocks 8388)
        run: |
          make_sub() {
            # Fixed URLs, evergreen content: android-ss.txt (plain ss:// link)
            # and sub.txt (base64 subscription for v2rayNG/NekoBox auto-update).
            # The URLs never change; only the content tracks the live endpoint.
            # sub.txt carries TWO doors when both exist: bore line + ygg line
            # (apps show both; desktop prefers ygg, bore is the fallback).
            SS_URL="$(cat ss_url.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$SS_URL" ] && return 0
            SS_HOST="${SS_URL%%:*}"; SS_PORT="${SS_URL##*:}"
            PASS="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0]['password'])")"
            METHOD="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0].get('method','aes-256-gcm'))")"
            [ -z "$PASS" ] && return 0
            USERINFO="$(printf '%s' "$METHOD:$PASS" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
            LINK="ss://${USERINFO}@${SS_HOST}:${SS_PORT}#IPNET-USA"
            printf '%s' "$LINK" > android-ss.txt
            YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            if [ -n "$YGG_URL" ]; then
              YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
              YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
              if [ -n "$YGG_HOST" ] && [ -n "$YGG_PORT" ]; then
                LINK_YGG="ss://${USERINFO}@[${YGG_HOST}]:${YGG_PORT}#IPNET-USA-YGG"
                printf '%s\n%s' "$LINK" "$LINK_YGG" | base64 -w0 > sub.txt
                export IPNET_LINK_YGG="$LINK_YGG"
                echo "sub.txt: bore + ygg links published"
                return 0
              fi
            fi
            printf '%s' "$LINK" | base64 -w0 > sub.txt
          }
          update_readme() {
            # Live block goes INSIDE the normal README (no separate file).
            # Needs <!--IPNET-LIVE-START--> / <!--IPNET-LIVE-END--> markers
            # (shipped in USER_README.md); appends them if ever missing.
            [ -z "$LINK" ] && return 0
            export IPNET_LINK="$LINK"
            export IPNET_SUB="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/sub.txt"
            export IPNET_REPO="https://github.com/$GITHUB_REPOSITORY"
            python3 -c 'import os,re; ygg=os.environ.get("IPNET_LINK_YGG",""); extra=("\n\n- Mesh link (stable, Yggdrasil app + v2rayNG):\n```\n"+ygg+"\n```" if ygg else ""); block=("<!--IPNET-LIVE-START-->\n## Live connection (auto-updated, copy from here)\n\n- Repo: "+os.environ["IPNET_REPO"]+"\n\n- Direct link (copy/QR):\n```\n"+os.environ["IPNET_LINK"]+"\n```"+extra+"\n\n- Subscription (fixed forever, auto-updates):\n```\n"+os.environ["IPNET_SUB"]+"\n```\n<!--IPNET-LIVE-END-->"); s=open("README.md",encoding="utf-8").read(); pat=re.compile(r"<!--IPNET-LIVE-START-->.*?<!--IPNET-LIVE-END-->",re.S); s=pat.sub(block,s,count=1) if pat.search(s) else s+"\n"+block+"\n"; open("README.md","w",encoding="utf-8").write(s); print("README live block updated")'
            git rm --quiet CONNECT.md 2>/dev/null || true
          }
          echo "Starting bore tunnels ..."
          rm -f /tmp/bore.log /tmp/bore-ss.log
          /tmp/bore local 8080 --to bore.pub > /tmp/bore.log 2>&1 &
          echo $! > /tmp/bore.pid
          /tmp/bore local 8388 --to bore.pub > /tmp/bore-ss.log 2>&1 &
          echo $! > /tmp/bore-ss.pid
          sleep 12
          echo "=== bore http-proxy ==="; cat /tmp/bore.log
          echo "=== bore shadowsocks ==="; cat /tmp/bore-ss.log
          URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore.log | head -1)
          SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log | head -1)
          if [ -z "$URL" ]; then echo "BORE_HTTP_FAIL"; exit 1; fi
          if [ -z "$SS_URL" ]; then echo "BORE_SS_FAIL"; exit 1; fi
          echo "$URL" > bore_url.txt
          echo "$SS_URL" > ss_url.txt
          {
            echo "HTTP_PROXY=$URL (user x5coder, http only - CONNECT blocked by EG ISP)"
            echo "SHADOWSOCKS=$SS_URL (aes-256-gcm, pass X5_Secure_2026!Strong - full https)"
          } | tee /tmp/urls.txt
          cat /tmp/urls.txt > proxy_urls.txt
          make_sub
          update_readme
          git config user.name "proxy-bot"
          git config user.email "bot@proxy.usa"
          git pull --rebase --autostash || true
          git add bore_url.txt ss_url.txt proxy_urls.txt android-ss.txt sub.txt README.md || true
          git commit -m "update bore $URL ss $SS_URL" || true
          git push || true
          date +%s > /tmp/tunnels-born  # birth clock for proactive rotation
          echo "### HTTP_PROXY: $URL" >> $GITHUB_STEP_SUMMARY
          echo "### SHADOWSOCKS: $SS_URL" >> $GITHUB_STEP_SUMMARY

      - name: Public loopback test (http via bore + ss via local client)
        run: |
          URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore.log | head -1)
          SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log | head -1)
          SS_HOST=$(echo $SS_URL | cut -d: -f1)
          SS_PORT=$(echo $SS_URL | cut -d: -f2)
          echo "Testing HTTP via public URL: $URL"
          curl -s --max-time 20 -x "http://x5coder:X5_Secure_2026!Strong@$URL" http://httpbin.org/ip || { echo "PUBLIC HTTP FAIL"; exit 1; }
          echo ""
          echo "NOTE: public https via plain CONNECT is expected to work from US runner (loopback) but BLOCKED from EG ISP - testing loopback anyway:"
          curl -s --max-time 30 -x "http://x5coder:X5_Secure_2026!Strong@$URL" https://httpbin.org/ip || echo "PUBLIC HTTPS (loopback) FAIL - check log"
          echo ""
          echo "=== Testing Shadowsocks through public bore URL ($SS_URL) ==="
          printf '{"log":{"level":"info"},"inbounds":[{"type":"socks","tag":"socks-in","listen":"127.0.0.1","listen_port":1080}],"outbounds":[{"type":"shadowsocks","tag":"ss-out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$SS_HOST" "$SS_PORT" > /tmp/sb-client.json
          /tmp/sing-box run -c /tmp/sb-client.json > /tmp/sb-client.log 2>&1 &
          sleep 3
          cat /tmp/sb-client.log
          echo "--- ss: http via socks ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:1080 http://httpbin.org/ip || { echo "SS HTTP FAIL"; exit 1; }
          echo ""
          echo "--- ss: https via socks (THE REAL TEST) ---"
          curl -s --max-time 30 --socks5-hostname 127.0.0.1:1080 https://httpbin.org/ip || { echo "SS HTTPS FAIL"; exit 1; }
          echo ""
          echo "--- ss: ipinfo (should be US) ---"
          curl -s --max-time 20 --socks5-hostname 127.0.0.1:1080 https://ipinfo.io/json | head -15 || true
          echo ""
          echo "=== Testing Shadowsocks through MESH (ygg) leg ==="
          YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
          if [ -n "$YGG_URL" ]; then
            YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
            YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
            echo "--- ygg L3: raw TCP to [$YGG_HOST]:$YGG_PORT via mesh ---"
            timeout 10 bash -c "cat < /dev/null > /dev/tcp/$YGG_HOST/$YGG_PORT" \
              && echo "YGG L3 TCP OK" || echo "YGG L3 TCP FAIL (mesh routing not converged yet)"
            echo "--- ygg L7: ss handshake + http via socks-1082 ---"
            printf '{"log":{"level":"info"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1082}],"outbounds":[{"type":"shadowsocks","tag":"out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$YGG_HOST" "$YGG_PORT" > /tmp/sb-ygg.json
            /tmp/sing-box run -c /tmp/sb-ygg.json > /tmp/sb-ygg.log 2>&1 &
            sleep 3
            echo "--- ygg: http via socks-1082 ---"
            curl -s --max-time 30 --socks5-hostname 127.0.0.1:1082 http://httpbin.org/ip && echo "" && echo "YGG LEG OK (real traffic over mesh)" || echo "YGG LEG FAIL (bore continues alone - mesh needs more warmup or DHT convergence)"
            echo "--- sb-ygg log tail ---"; tail -20 /tmp/sb-ygg.log || true
          else
            echo "no ygg endpoint published - bore only"
          fi
          pkill -f sb-ygg.json 2>/dev/null || true
          echo "ALL PUBLIC TESTS OK"

      - name: Keep alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make_sub() {
            SS_URL="$(cat ss_url.txt 2>/dev/null | tr -d ' \r\n')"
            [ -z "$SS_URL" ] && return 0
            SS_HOST="${SS_URL%%:*}"; SS_PORT="${SS_URL##*:}"
            PASS="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0]['password'])")"
            METHOD="$(python3 -c "import json;print(json.load(open('singbox-server.json'))['inbounds'][0].get('method','aes-256-gcm'))")"
            [ -z "$PASS" ] && return 0
            USERINFO="$(printf '%s' "$METHOD:$PASS" | base64 -w0 | tr '+/' '-_' | tr -d '=')"
            LINK="ss://${USERINFO}@${SS_HOST}:${SS_PORT}#IPNET-USA"
            printf '%s' "$LINK" > android-ss.txt
            YGG_URL="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            if [ -n "$YGG_URL" ]; then
              YGG_HOST="$(echo "$YGG_URL" | sed 's/^\[//;s/\].*//')"
              YGG_PORT="$(echo "$YGG_URL" | sed 's/.*\]://')"
              if [ -n "$YGG_HOST" ] && [ -n "$YGG_PORT" ]; then
                LINK_YGG="ss://${USERINFO}@[${YGG_HOST}]:${YGG_PORT}#IPNET-USA-YGG"
                printf '%s\n%s' "$LINK" "$LINK_YGG" | base64 -w0 > sub.txt
                export IPNET_LINK_YGG="$LINK_YGG"
                echo "sub.txt: bore + ygg links published"
                return 0
              fi
            fi
            printf '%s' "$LINK" | base64 -w0 > sub.txt
          }
          update_readme() {
            # Live block goes INSIDE the normal README (no separate file).
            # Needs <!--IPNET-LIVE-START--> / <!--IPNET-LIVE-END--> markers
            # (shipped in USER_README.md); appends them if ever missing.
            [ -z "$LINK" ] && return 0
            export IPNET_LINK="$LINK"
            export IPNET_SUB="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/sub.txt"
            export IPNET_REPO="https://github.com/$GITHUB_REPOSITORY"
            python3 -c 'import os,re; ygg=os.environ.get("IPNET_LINK_YGG",""); extra=("\n\n- Mesh link (stable, Yggdrasil app + v2rayNG):\n```\n"+ygg+"\n```" if ygg else ""); block=("<!--IPNET-LIVE-START-->\n## Live connection (auto-updated, copy from here)\n\n- Repo: "+os.environ["IPNET_REPO"]+"\n\n- Direct link (copy/QR):\n```\n"+os.environ["IPNET_LINK"]+"\n```"+extra+"\n\n- Subscription (fixed forever, auto-updates):\n```\n"+os.environ["IPNET_SUB"]+"\n```\n<!--IPNET-LIVE-END-->"); s=open("README.md",encoding="utf-8").read(); pat=re.compile(r"<!--IPNET-LIVE-START-->.*?<!--IPNET-LIVE-END-->",re.S); s=pat.sub(block,s,count=1) if pat.search(s) else s+"\n"+block+"\n"; open("README.md","w",encoding="utf-8").write(s); print("README live block updated")'
            git rm --quiet CONNECT.md 2>/dev/null || true
          }
          push_urls() {
            make_sub
            git config user.name "proxy-bot" || true
            git config user.email "bot@proxy.usa" || true
            git pull --rebase --autostash || true
            git add bore_url.txt ss_url.txt ss_ygg_url.txt proxy_urls.txt android-ss.txt sub.txt README.md || true
            git add -f ygg-node/ygg.conf 2>/dev/null || true
            git commit -m "update bore $1 ss $2 (${_why:-auto-heal})" || true
            git push || true
          }
          # Monitor client: talks SOCKS to 127.0.0.1:1081, exits through the
          # PUBLIC bore SS tunnel. A plain TCP check is NOT enough: bore.pub
          # can accept TCP while the server behind it refuses everything.
          restart_monitor() {
            echo "restarting monitor client for $1 ..."
            pkill -f sb-monitor.json 2>/dev/null || true
            sleep 1
            printf '{"log":{"level":"error"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1081}],"outbounds":[{"type":"shadowsocks","tag":"out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$1" "$2" > /tmp/sb-monitor.json
            /tmp/sing-box run -c /tmp/sb-monitor.json > /tmp/sb-monitor.log 2>&1 &
            echo $! > /tmp/sbmon.pid
            sleep 2
          }
          ss_alive() {
            # real end-to-end traffic through the public tunnel (2 hosts,
            # avoids false alarms from one flaky test site)
            curl -s --max-time 10 --socks5-hostname 127.0.0.1:1081 http://httpbin.org/ip >/dev/null 2>&1 && return 0
            curl -s --max-time 10 --socks5-hostname 127.0.0.1:1081 http://ipinfo.io/ip >/dev/null 2>&1 && return 0
            return 1
          }
          restart_http_bore() {
            # Overlap restart: the new tunnel goes up FIRST and the old one
            # stays alive ~210s after the push, so connected clients keep
            # working on the old port until they pick up the new one.
            echo "RESTARTING http bore tunnel (overlap: keep old alive)..."
            OLD_PID=$(cat /tmp/bore.pid 2>/dev/null || echo "")
            rm -f /tmp/bore-new.log
            /tmp/bore local 8080 --to bore.pub > /tmp/bore-new.log 2>&1 &
            echo $! > /tmp/bore.pid
            sleep 8
            cat /tmp/bore-new.log
            if grep -qoE "bore\.pub:[0-9]+" /tmp/bore-new.log 2>/dev/null; then
              mv -f /tmp/bore-new.log /tmp/bore.log
            else
              echo "new http bore failed - keeping old tunnel"
              kill $(cat /tmp/bore.pid) 2>/dev/null || true
              [ -n "$OLD_PID" ] && echo "$OLD_PID" > /tmp/bore.pid || true
              return 0  # keep-alive step runs under bash -e: never fail it
            fi
            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              ( sleep 210; kill "$OLD_PID" 2>/dev/null || true ) &
              echo "old http bore $OLD_PID kept alive 210s for overlap"
            fi
          }
          restart_ss_bore() {
            # Overlap restart: same as http - new tunnel first, old kept
            # ~210s so the client never feels the switch.
            echo "RESTARTING ss bore tunnel (overlap: keep old alive)..."
            OLD_PID=$(cat /tmp/bore-ss.pid 2>/dev/null || echo "")
            rm -f /tmp/bore-ss-new.log
            /tmp/bore local 8388 --to bore.pub > /tmp/bore-ss-new.log 2>&1 &
            echo $! > /tmp/bore-ss.pid
            sleep 8
            cat /tmp/bore-ss-new.log
            if grep -qoE "bore\.pub:[0-9]+" /tmp/bore-ss-new.log 2>/dev/null; then
              mv -f /tmp/bore-ss-new.log /tmp/bore-ss.log
            else
              echo "new ss bore failed - keeping old tunnel"
              kill $(cat /tmp/bore-ss.pid) 2>/dev/null || true
              [ -n "$OLD_PID" ] && echo "$OLD_PID" > /tmp/bore-ss.pid || true
              return 0  # keep-alive step runs under bash -e: never fail it
            fi
            if [ -n "$OLD_PID" ] && kill -0 "$OLD_PID" 2>/dev/null; then
              ( sleep 210; kill "$OLD_PID" 2>/dev/null || true ) &
              echo "old ss bore $OLD_PID kept alive 210s for overlap"
            fi
          }
          restart_ss_server() {
            echo "RESTARTING local shadowsocks server..."
            kill $(cat /tmp/ss.pid) 2>/dev/null || true
            sleep 2
            /tmp/sing-box run -c singbox-server.json > /tmp/ss.log 2>&1 &
            echo $! > /tmp/ss.pid
            sleep 2
          }
          # start the monitor against the current public SS endpoint
          _SS0=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log 2>/dev/null | head -1)
          restart_monitor "$(echo $_SS0 | cut -d: -f1)" "$(echo $_SS0 | cut -d: -f2)"
          fail_http=0; fail_ss=0
          ygg_check() {
            # reports: ok | restarted | dead  (same run key => same mesh IP)
            if pgrep -f "yggdrasil -useconffile" >/dev/null 2>&1; then
              echo ok; return 0
            fi
            echo "ygg node dead - restarting with SAME run identity ..." >&2
            sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
            sleep 20
            if pgrep -f "yggdrasil -useconffile" >/dev/null 2>&1; then
              echo restarted; return 0
            fi
            echo dead; return 1
          }
          ygg_publish() {
            # refresh ss_ygg_url.txt from the live node; republish on change.
            # Publish ONLY while peered - never broadcast an unroutable ghost.
            if ! yggdrasilctl -endpoint tcp://127.0.0.1:9001 getPeers 2>/dev/null | grep -q " Up "; then
              echo "ygg not peered - publish skipped (file keeps last value)"
              return 1
            fi
            _ip=$(yggdrasilctl -endpoint tcp://127.0.0.1:9001 getSelf 2>/dev/null | grep -v "/64" | grep -oE "[23][0-9a-f]{2}:[0-9a-f:]+:[0-9a-f]+" | head -1)
            [ -z "$_ip" ] && return 1
            _cur="[${_ip}]:8388"
            if [ "$(cat ss_ygg_url.txt 2>/dev/null)" != "$_cur" ]; then
              echo "$_cur" > ss_ygg_url.txt
              _why="ygg-republish"
              push_urls "ygg" "$_cur"
              echo "YGG endpoint (re)published: $_cur"
            fi
            return 0
          }
          # Proactive rotation: bore.pub drops tunnels at ~5 min (observed:
          # both tunnels dying together every ~5 min, repeatedly). Waiting
          # for death = minutes of downtime per cycle; rotating BEFORE the
          # cap (with overlap, old kept 210s) = ~zero downtime. The birth
          # clock is shared by heals and rotations so they never double
          # fire inside one window (~15 bot commits/hr is the price).
          ROTATE_EVERY=210
          mark_born() { date +%s > /tmp/tunnels-born 2>/dev/null || true; }
          tunnel_age() {
            _b=$(cat /tmp/tunnels-born 2>/dev/null || echo 0)
            echo $(( $(date +%s) - ${_b:-0} ))
          }
          publish_current() {
            URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore.log 2>/dev/null | head -1)
            SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log 2>/dev/null | head -1)
            echo "$URL" > bore_url.txt; echo "$SS_URL" > ss_url.txt
            { echo "HTTP_PROXY=$URL (user x5coder, http only - CONNECT blocked by EG ISP)";
              echo "SHADOWSOCKS=$SS_URL (aes-256-gcm, pass X5_Secure_2026!Strong - full https)"; } > proxy_urls.txt
            push_urls "$URL" "$SS_URL"
            mark_born
          }
          # Mid-run churn detector: same key => same mesh IP, ALWAYS. If
          # the published endpoint ever changes under a live run, the
          # identity churned (overlapping generation / history rewrite)
          # and every client route must reconverge - say it LOUDLY.
          _ygg_birth="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
          _ygg_churn_warned=0
          for i in $(seq 1 600); do
            echo "[$i/600] $(date -u) - alive"
            # --- generational handover (first iteration only) ---
            # Old run keeps serving while this run prepared + published its
            # own tunnels. Now: retire older runs, then REPUBLISH our own
            # endpoints so no stale file can point at the dying generation.
            if [ "$i" -eq 1 ]; then
              for _rid in $(gh run list --repo "$GITHUB_REPOSITORY" \
                  --workflow proxy.yml --status in_progress --limit 10 \
                  --json databaseId -q '.[].databaseId' 2>/dev/null); do
                if [ -n "$_rid" ] && [ "$_rid" -lt "$GITHUB_RUN_ID" ] 2>/dev/null; then
                  echo "retiring older run $_rid (our tunnels verified+published) ..."
                  gh run cancel "$_rid" --repo "$GITHUB_REPOSITORY" || true
                fi
              done
              publish_current
              echo "HANDOVER: predecessors retired, own endpoints republished."
            fi
            URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore.log 2>/dev/null | head -1)
            SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log 2>/dev/null | head -1)
            echo "HTTP_PROXY bore: $URL | SHADOWSOCKS bore: $SS_URL | YGG: $(cat ss_ygg_url.txt 2>/dev/null || echo none)"
            # One-line process roll-call (was 5 lines/loop of pure noise).
            _pids=""
            for svc in "proxy:/tmp/proxy.pid" "ss:/tmp/ss.pid" "bore:/tmp/bore.pid" "bore-ss:/tmp/bore-ss.pid" "sbmon:/tmp/sbmon.pid"; do
              name=$(echo $svc | cut -d: -f1); pidf=$(echo $svc | cut -d: -f2)
              if kill -0 $(cat $pidf) 2>/dev/null; then _pids="$_pids $name=ok"; else _pids="$_pids $name=DEAD"; fi
            done
            echo "pids:$_pids"
            _ygg_bad=0  # set to 1 below if the mesh leg misbehaves (tails gate)
            _bore_bad=0  # set to 1 on any bore test FAIL (tails gate)
            _ygg_st=$(ygg_check) && echo "ygg node: $_ygg_st" || echo "ygg node: dead (bore continues alone)"
            if [ "$_ygg_st" != "dead" ]; then ygg_publish || echo "ygg publish skipped"; fi
            _ycur="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            if [ "$_ygg_churn_warned" -eq 0 ] && [ -n "$_ygg_birth" ] \
              && [ -n "$_ycur" ] && [ "$_ycur" != "$_ygg_birth" ]; then
              _ygg_churn_warned=1
              echo "WARNING: YGG endpoint changed MID-RUN "
              echo "  birth: $_ygg_birth"
              echo "  now:   $_ycur"
              echo "  (identity churn - client mesh routes must reconverge!)"
              echo "### YGG_CHURN: endpoint changed mid-run!" >> $GITHUB_STEP_SUMMARY
            fi
            curl -s http://127.0.0.1:8080/health | grep -q "Proxy" && echo "http-proxy health ok" || echo "http-proxy health fail"
            # --- real public tests every 20s (bodies swallowed: the old code
            # printed the full {"origin":...} JSON every loop = pure spam) ---
            if curl -s -o /dev/null --max-time 15 -x "http://x5coder:X5_Secure_2026!Strong@$URL" http://httpbin.org/ip; then
              echo "public HTTP ok"; fail_http=0
            else
              echo "public HTTP FAIL ($((fail_http+1))/2)"; fail_http=$((fail_http+1)); _bore_bad=1
            fi
            if ss_alive; then
              echo "public SS end-to-end ok"; fail_ss=0
            else
              echo "public SS end-to-end FAIL ($((fail_ss+1))/2)"; fail_ss=$((fail_ss+1)); _bore_bad=1
            fi
            # --- ygg mesh leg: traffic test, auto-heal like bore ---
            # (process-alive is NOT enough: the mesh can stall while the
            # daemon runs. Same key on restart => same mesh IP, no republish
            # needed unless the IP actually changed.)
            _yep="$(cat ss_ygg_url.txt 2>/dev/null | tr -d ' \r\n')"
            if [ -n "$_yep" ]; then
              # one persistent monitor (1083); (re)started only if its own
              # process died OR the published ygg endpoint changed
              if ! pgrep -f sb-yggmon.json >/dev/null 2>&1 \
                || [ "$(cat /tmp/sb-yggmon.ep 2>/dev/null)" != "$_yep" ]; then
                _yh="$(echo "$_yep" | sed 's/^\[//;s/\].*//')"
                _yp="$(echo "$_yep" | sed 's/.*\]://')"
                printf '{"log":{"level":"error"},"inbounds":[{"type":"socks","tag":"in","listen":"127.0.0.1","listen_port":1083}],"outbounds":[{"type":"shadowsocks","tag":"out","server":"%s","server_port":%s,"method":"aes-256-gcm","password":"X5_Secure_2026!Strong"}]}' "$_yh" "$_yp" > /tmp/sb-yggmon.json
                /tmp/sing-box run -c /tmp/sb-yggmon.json > /tmp/sb-yggmon.log 2>&1 &
                sleep 2
                echo "$_yep" > /tmp/sb-yggmon.ep
                echo "ygg monitor (re)started on 1083"
              fi
              if curl -s --max-time 10 --socks5-hostname 127.0.0.1:1083 http://httpbin.org/ip >/dev/null 2>&1 \
                || curl -s --max-time 10 --socks5-hostname 127.0.0.1:1083 http://ipinfo.io/ip >/dev/null 2>&1; then
                echo "public YGG end-to-end ok"
              else
                echo "public YGG end-to-end FAIL - restarting mesh node (same key) ..."
                _ygg_bad=1
                sudo pkill -f "yggdrasil -useconffile" 2>/dev/null || true
                sleep 2
                sudo nohup yggdrasil -useconffile ygg-node/ygg.conf > /tmp/ygg.log 2>&1 &
                sleep 15
                ygg_publish || echo "ygg republish skipped"
                echo "ygg node restarted after traffic failure"
              fi
            fi
            # --- auto-heal on FIRST consecutive failure (fast) ---
            changed=0; _why="auto-heal"
            if [ "$fail_http" -ge 1 ]; then restart_http_bore; fail_http=0; changed=1; fi
            if [ "$fail_ss" -ge 1 ]; then
              restart_ss_bore
              SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log 2>/dev/null | head -1)
              restart_monitor "$(echo $SS_URL | cut -d: -f1)" "$(echo $SS_URL | cut -d: -f2)"
              if ! ss_alive; then
                echo "tunnel renewed but traffic still dead -> restarting ss server"
                restart_ss_server
                sleep 3
              fi
              fail_ss=0; changed=1
            fi
            if [ "$changed" -eq 1 ]; then
              publish_current
              echo "HEALED: HTTP=$URL SS=$SS_URL"
            fi
            # --- proactive rotation: beat bore.pub's ~5-min connection cap ---
            # (reactive heal above already ran this window -> skip; the birth
            # clock was just reset by publish_current)
            _age=$(tunnel_age)
            if [ "$changed" -eq 0 ] && [ "$_age" -ge "$ROTATE_EVERY" ]; then
              echo "tunnels ${_age}s old - proactive overlap rotation..."
              restart_http_bore
              restart_ss_bore
              SS_URL=$(grep -oE "bore\.pub:[0-9]+" /tmp/bore-ss.log 2>/dev/null | head -1)
              restart_monitor "$(echo $SS_URL | cut -d: -f1)" "$(echo $SS_URL | cut -d: -f2)"
              if ss_alive; then
                _why="rotation"
                publish_current
                echo "ROTATED proactively, new tunnels verified end-to-end: HTTP=$URL SS=$SS_URL"
              else
                echo "proactive rotation gave dead tunnels - NOT publishing (reactive heal retries next round)"
              fi
            fi
            # Diagnostics ONLY on trouble (the old code dumped proxy.log
            # tail every 20s x 600 loops; healthy loops stay one screen).
            if [ "$_bore_bad" -eq 1 ] || [ "$_ygg_bad" -eq 1 ]; then
              echo "--- proxy.log tail ---"; tail -5 /tmp/proxy.log || true
              echo "--- ss.log tail ---"; tail -5 /tmp/ss.log || true
              echo "--- ygg.log tail ---"; tail -10 /tmp/ygg.log || true
            fi
            sleep 20
          done
