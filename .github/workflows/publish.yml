# IPNET first-setup — SAFE static publisher (no proxy, no tunnel).
#
# This is the ONLY workflow in v3. It does NOT run server.py, sing-box,
# or cloudflared (running those on Actions is what got fresh accounts
# banned). What it does: build sub.txt + android-vless.txt + README
# live block ONCE from worker.txt + the SHARED uuid in singbox-server.json.
#
# Design: ONE shared uuid for everybody (worker.js DEFAULT_UUID).
# No Variables step, no copy-paste of uuids — copy + Deploy + worker.txt
# + Start, done. No cron, no loop, no spam pushes.

name: First setup (subscription)

on:
  workflow_dispatch:
  push:
    paths:
      - "worker.txt"
      - "singbox-server.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build subscription
        run: |
          HOST="$(cat worker.txt 2>/dev/null | tr -d ' \r\n' | sed 's|https://||;s|/.*||')"
          case "$HOST" in *.workers.dev) echo "worker: $HOST";; *) echo "paste your Worker hostname into worker.txt first"; exit 0;; esac
          python3 build_sub.py "$HOST"
          git config user.name "ipnet-bot"
          git config user.email "bot@ipnet.local"
          git add sub.txt android-vless.txt README.md || true
          git commit -m "setup: subscription for $HOST" || true
          git push || true
