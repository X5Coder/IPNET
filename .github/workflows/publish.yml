# IPNET sub.txt generator — SAFE static publisher (no proxy, no tunnel).
#
# This is the ONLY workflow in v3. It does NOT run server.py, sing-box,
# or cloudflared (running those on Actions is what got fresh accounts
# banned). On first push it makes a FRESH random uuid for THIS repo copy
# (every user gets their own password, automatic), then builds sub.txt +
# android-vless.txt + README live block once worker.txt is set.
#
# The deployed worker.js ALSO carries a built-in DEFAULT_UUID so it works
# even before this runs. No cron, no loop, no spam pushes.

name: First setup (uuid + subscription)

on:
  workflow_dispatch:
  push:
    paths:
      - "worker.txt"
      - "singbox-server.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure unique uuid + build subscription
        run: |
          python3 setup_uuid.py
          HOST="$(cat worker.txt 2>/dev/null | tr -d ' \r\n' | sed 's|https://||;s|/.*||')"
          case "$HOST" in *.workers.dev) echo "worker: $HOST";; *) echo "uuid ready - paste Worker hostname into worker.txt"; git config user.name "ipnet-bot"; git config user.email "bot@ipnet.local"; git add singbox-server.json; git commit -m "unique uuid for this copy" || true; git push || true; exit 0;; esac
          python3 build_sub.py "$HOST"
