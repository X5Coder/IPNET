# IPNET first-setup — SAFE static publisher (no proxy, no tunnel).
#
# This is the ONLY workflow. It does NOT run server.py, sing-box,
# or cloudflared on Actions (running those is what got fresh accounts
# banned). What it does: build sub.txt + android.txt + README live
# block ONCE from render.txt (Render Oregon, preferred) or worker.txt.
#
# Design: ONE shared login for every Render deploy, ONE shared uuid for
# Worker — zero config: copy + Deploy + render.txt + Start, done.
# No cron, no loop, no spam pushes.

name: First setup (subscription)

on:
  workflow_dispatch:
  push:
    paths:
      - "render.txt"
      - "worker.txt"
      - "singbox-server.json"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository != 'X5Coder/IPNET'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build subscription
        run: |
          HOST="$(cat render.txt 2>/dev/null | tr -d ' \r\n' | sed 's|https://||;s|/.*||')"
          case "$HOST" in *.onrender.com) echo "render: $HOST";; *) HOST="$(cat worker.txt 2>/dev/null | tr -d ' \r\n' | sed 's|https://||;s|/.*||')"; case "$HOST" in *.workers.dev) echo "worker: $HOST";; *) echo "paste your Render hostname into render.txt first"; exit 0;; esac;; esac
          python3 build_sub.py "$HOST"
          git config user.name "ipnet-bot"
          git config user.email "bot@ipnet.local"
          git add sub.txt android.txt android-vless.txt README.md || true
          git commit -m "setup: subscription for $HOST" || true
          git push || true
